name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Both modules resolve github.com/go-filesystems/{interface,fat32} from the
  # module proxy at v0.1.0 — no sibling checkout, no local replace except
  # fat32demo's pointer at its own parent. GOWORK=off keeps any developer
  # go.work out of CI regardless.
  GOWORK: off

jobs:
  # ----------------------------------------------------------------------
  # Core module — depends ONLY on go-filesystems/interface plus the standard
  # library. The 100% coverage gate is enforced here.
  # ----------------------------------------------------------------------
  core-native:
    name: core native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout nfs
        uses: actions/checkout@v7
        with:
          path: nfs

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: nfs/go.mod

      - name: Vet
        working-directory: nfs
        run: go vet -mod=mod ./...

      - name: Build (CGO disabled — the module must stay pure Go)
        working-directory: nfs
        env:
          CGO_ENABLED: "0"
        run: go build -mod=mod ./...

      - name: Test (race + coverage)
        working-directory: nfs
        run: go test -mod=mod -race -coverpkg=./... -coverprofile=cover.out -covermode=atomic ./...

      - name: Enforce coverage gate
        working-directory: nfs
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 100.0) ? 0 : 1 }' \
            || { echo "coverage ${pct}% below gate 100.0%"; exit 1; }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core-${{ matrix.arch }}
          path: nfs/cover.out
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # Core module — emulated 64-bit arches. NFS and XDR are big-endian on the
  # wire, so s390x is not a formality here: it is the arch on which a
  # forgotten binary.BigEndian would still pass on the developer's machine.
  # ----------------------------------------------------------------------
  core-emulated:
    name: core emulated ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu: rv64,v=true,vlen=128
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu: power9
          - arch: s390x
            image: debian:trixie
            qemu: qemu
    steps:
      - name: Checkout nfs
        uses: actions/checkout@v7
        with:
          path: nfs

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: nfs/go.mod

      - name: Register QEMU binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      - name: Cross-compile per-package test binaries
        working-directory: nfs
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/tests
          for pkg in $(go list -mod=mod ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            go test -mod=mod -c -cover -o "/tmp/tests/${name}.test" "$pkg"
          done
          ls -la /tmp/tests

      - name: Run test binaries under QEMU (${{ matrix.arch }})
        env:
          QEMU_CPU: ${{ matrix.qemu }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(/tmp/tests/*.test)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "no test binaries to run"; exit 0
          fi
          rc=0
          for bin in "${bins[@]}"; do
            echo "::group::$(basename "$bin")"
            if ! docker run --rm \
              --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU="${QEMU_CPU}" \
              --user 1000:1000 \
              -v /tmp/tests:/t -w /t \
              ${{ matrix.image }} \
              "./$(basename "$bin")" -test.v; then
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  # ----------------------------------------------------------------------
  # The module must build for every platform it claims to serve. A mount is
  # a client-side act, but the server has to run somewhere.
  # ----------------------------------------------------------------------
  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: nfs
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: nfs/go.mod
      - name: Build for every advertised platform
        working-directory: nfs
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 \
                        linux/amd64 linux/arm64 freebsd/amd64 openbsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -mod=mod ./...
            echo "ok $target"
          done

  # ----------------------------------------------------------------------
  # fat32demo — the real-image harness. It imports the fat32 driver, so it is
  # its own module, keeping the core module free of any driver dependency
  # (the same split detect/fat32reg uses).
  # ----------------------------------------------------------------------
  demo-native:
    name: demo native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: nfs
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: nfs/fat32demo/go.mod

      - name: Vet
        working-directory: nfs/fat32demo
        run: go vet -mod=mod ./...

      - name: Build
        working-directory: nfs/fat32demo
        env:
          CGO_ENABLED: "0"
        run: go build -mod=mod ./...

      # The gate covers ./demo/..., which holds everything the command does.
      # main.go is a single os.Exit(demo.Main(...)) and is excluded rather
      # than papered over with a lowered threshold.
      - name: Test (race + coverage)
        working-directory: nfs/fat32demo
        run: go test -mod=mod -race -coverpkg=./demo/... -coverprofile=cover.out -covermode=atomic ./demo/...

      - name: Enforce coverage gate
        working-directory: nfs/fat32demo
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 100.0) ? 0 : 1 }' \
            || { echo "coverage ${pct}% below gate 100.0%"; exit 1; }

  # ----------------------------------------------------------------------
  # The end-to-end proof: a real Linux kernel NFS client mounts a real FAT32
  # image and reads it back. Everything above only shows the server agrees
  # with itself; this shows a kernel agrees with it.
  # ----------------------------------------------------------------------
  live-mount:
    name: live mount (linux kernel client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: nfs
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: nfs/fat32demo/go.mod

      - name: Install the NFS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nfs-common

      - name: Build a real FAT32 image with the driver
        working-directory: nfs/fat32demo
        run: |
          set -euo pipefail
          mkdir -p /tmp/live ./mkimg
          cat > ./mkimg/main.go <<'EOF'
          package main

          import (
              "bytes"
              "log"

              fat32 "github.com/go-filesystems/fat32"
          )

          func main() {
              fs, err := fat32.Format("/tmp/live/disk.img", 64<<20, fat32.FormatConfig{Label: "LIVE"})
              if err != nil {
                  log.Fatal(err)
              }
              if err := fs.WriteFile("/HELLO.TXT", []byte("hello from a real image\n"), 0o644); err != nil {
                  log.Fatal(err)
              }
              if err := fs.MkDir("/SUB", 0o755); err != nil {
                  log.Fatal(err)
              }
              if err := fs.WriteFile("/SUB/BIG.BIN", bytes.Repeat([]byte("0123456789abcdef"), 8192), 0o644); err != nil {
                  log.Fatal(err)
              }
              if err := fs.Close(); err != nil {
                  log.Fatal(err)
              }
          }
          EOF
          go run -mod=mod ./mkimg
          rm -rf ./mkimg
          ls -l /tmp/live/disk.img

      - name: Serve it and mount it with the kernel client
        working-directory: nfs/fat32demo
        run: |
          set -euo pipefail
          go build -mod=mod -o /tmp/live/fat32demo .
          /tmp/live/fat32demo -image /tmp/live/disk.img -addr 127.0.0.1:12049 &
          demo_pid=$!
          # Clean up whatever happens: never leave a mount behind.
          trap 'sudo umount -f /mnt/live 2>/dev/null || true; kill $demo_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/12049) 2>/dev/null; then break; fi
            sleep 0.2
          done
          sudo mkdir -p /mnt/live
          sudo mount -t nfs -o vers=3,tcp,port=12049,mountport=12049,nolock,hard,timeo=600 \
            127.0.0.1:/ /mnt/live
          mount | grep /mnt/live

          echo "--- ls ---"
          ls -la /mnt/live /mnt/live/SUB
          echo "--- cat ---"
          cat /mnt/live/HELLO.TXT
          echo "--- find must descend (nlink must not trigger the leaf optimisation) ---"
          test "$(find /mnt/live -type f | wc -l)" -eq 2
          echo "--- bytes must match what the driver holds ---"
          test "$(cat /mnt/live/HELLO.TXT)" = "hello from a real image"
          nfs_sum=$(sha256sum < /mnt/live/SUB/BIG.BIN | cut -d' ' -f1)
          want=$(python3 -c "import hashlib;print(hashlib.sha256(b'0123456789abcdef'*8192).hexdigest())")
          echo "over NFS: $nfs_sum"
          echo "expected: $want"
          test "$nfs_sum" = "$want"

          sudo umount /mnt/live
          echo "unmounted cleanly"

  # The measurement this repository's WRITE path exists for, taken over a REAL
  # Linux kernel NFS client rather than in process. Both arms run in the SAME
  # job, on the same runner, against the same image geometry, and differ in
  # exactly one flag: -no-positional hides the driver's WritableFile so the
  # server takes the ReadFile+splice+WriteFile path it took before it had one.
  # Anything else — two workflow runs, two commits, two machines — would
  # measure the runner as much as the code.
  live-write-bench:
    name: live write benchmark (linux kernel client)
    runs-on: ubuntu-latest
    # The whole-file arm is deliberately running the quadratic path, and how
    # long that takes is a property of the runner as much as of the code: the
    # same 8 MiB arm has taken 31 s and 69 s on different runners, and slower
    # ones exist. A cap turns "the defect is worse here than usual" into a
    # failed job rather than an hour of a queue.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: nfs
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: nfs/fat32demo/go.mod

      - name: Install the NFS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nfs-common

      - name: Measure 2 MiB in 64 KiB blocks, with and without a positional write
        working-directory: nfs/fat32demo
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench ./mkimg
          cat > ./mkimg/main.go <<'EOF'
          package main

          import (
              "log"
              "os"

              fat32 "github.com/go-filesystems/fat32"
          )

          // Formats a fresh image with one empty target file. A fresh image per
          // arm matters: a file that already has a cluster chain and one that
          // has to allocate every cluster are different workloads, and the two
          // arms must face the same one.
          func main() {
              _ = os.Remove(os.Args[1])
              fs, err := fat32.Format(os.Args[1], 64<<20, fat32.FormatConfig{Label: "BENCH"})
              if err != nil {
                  log.Fatal(err)
              }
              if err := fs.WriteFile("/TARGET.BIN", nil, 0o644); err != nil {
                  log.Fatal(err)
              }
              if err := fs.Close(); err != nil {
                  log.Fatal(err)
              }
          }
          EOF
          go build -mod=mod -o /tmp/bench/mkimg ./mkimg
          rm -rf ./mkimg
          go build -mod=mod -o /tmp/bench/fat32demo .

          # The ORIGINAL baseline, built from the same source with the driver
          # pinned to fat32 v0.1.0 — the version that was in this module's
          # go.mod when 90 kB/s was measured, and the last one with neither
          # Opener nor WritableFile.
          #
          # Pinning the driver rather than only passing -no-positional matters,
          # and getting this wrong would have produced a flattering number.
          # fat32 v0.3.0 removed TWO quadratics: the missing positional write,
          # and an allocCluster that read four bytes per candidate cluster and
          # restarted from cluster 2 on every call. Serving v0.3.0 with
          # -no-positional therefore measures a read-modify-write on top of a
          # FIXED allocator, which is a genuine intermediate figure but is not
          # what a user saw. All three arms are reported for that reason.
          cp -r . /tmp/baseline
          (cd /tmp/baseline \
            && go mod edit -replace=github.com/go-filesystems/nfs="$GITHUB_WORKSPACE/nfs" \
            && go mod edit -require=github.com/go-filesystems/fat32@v0.1.0 \
            && go mod tidy \
            && go build -mod=mod -o /tmp/bench/fat32demo-v010 .)
          sudo mkdir -p /mnt/bench

          # One arm. $1 is the label, $2 is either empty or -no-positional.
          #
          # dd uses oflag=direct so that each 64 KiB block is one WRITE RPC:
          # buffered writes would be coalesced by the page cache into wsize
          # chunks at a time the kernel chooses, which measures the writeback
          # heuristics rather than the server. wsize=65536 pins the block size
          # on the wire to the 64 KiB the measurement names.
          # $1 is the label, $2 the binary, $3 the tag the timing is filed
          # under, and $4.. any extra fat32demo flags;
          # and MIB the size to write. The size is a variable because the
          # claim being tested is a SHAPE, not a single number: the whole-file
          # path costs O(filesize) per request, so quadrupling the data must
          # cost about sixteen times as much, while the positional path must
          # stay linear. One size cannot tell those apart.
          MIB=2
          run_arm() {
            label="$1"; bin="$2"; tag="$3"; shift 3
            /tmp/bench/mkimg /tmp/bench/disk.img
            "$bin" -image /tmp/bench/disk.img -addr 127.0.0.1:12049 -rw "$@" &
            demo_pid=$!
            trap 'sudo umount -f /mnt/bench 2>/dev/null || true; kill $demo_pid 2>/dev/null || true' RETURN
            for i in $(seq 1 50); do
              if (exec 3<>/dev/tcp/127.0.0.1/12049) 2>/dev/null; then break; fi
              sleep 0.2
            done
            sudo mount -t nfs -o vers=3,tcp,port=12049,mountport=12049,nolock,hard,timeo=600,wsize=65536,rsize=65536 \
              127.0.0.1:/ /mnt/bench
            start=$(date +%s.%N)
            sudo dd if=/dev/urandom of=/mnt/bench/TARGET.BIN bs=64k count=$((MIB * 16)) \
              oflag=direct conv=notrunc status=none
            end=$(date +%s.%N)
            secs=$(python3 -c "print(f'{$end-$start:.2f}')")
            rate=$(python3 -c "print(f'{$MIB*1024*1024/($end-$start)/1000:.0f}')")
            echo "RESULT $label: $MIB MiB in 64 KiB blocks took ${secs}s (${rate} kB/s)"
            echo "$secs" > "/tmp/bench/secs.$MIB.$tag"
            sudo umount /mnt/bench
            kill $demo_pid 2>/dev/null || true
            wait $demo_pid 2>/dev/null || true
          }

          for MIB in 2 8; do
            run_arm "BEFORE  fat32 v0.1.0, whole-file write, original allocator" /tmp/bench/fat32demo-v010 before
            run_arm "AFTER   fat32 v0.3.0, positional write                  " /tmp/bench/fat32demo after
            # The middle arm answers one question only — is the gain the
            # positional write, or the quadratic-allocator fix that shipped
            # beside it in fat32 v0.3.0? — and 2 MiB answers it as well as
            # 8 MiB does, at a fraction of the cost. Running the slow path
            # twice at the large size buys nothing and can double a job that
            # is already dominated by the defect it is demonstrating.
            if [ "$MIB" = 2 ]; then
              run_arm "middle  fat32 v0.3.0, whole-file write, fixed allocator  " /tmp/bench/fat32demo middle -no-positional
            fi
          done

          # A benchmark that only prints regresses silently, so this one is a
          # gate. The threshold is deliberately far below what is measured
          # (20x at 8 MiB) rather than close to it: a shared runner's variance
          # is real, and a gate that fails on noise gets deleted. Only the
          # 8 MiB point is asserted — at 2 MiB the fixed per-request cost
          # dominates and the two paths are within each other's noise, which
          # is itself the reason the job measures two sizes.
          before=$(cat /tmp/bench/secs.8.before)
          after=$(cat /tmp/bench/secs.8.after)
          python3 - "$before" "$after" <<'PY'
          import sys
          before, after = float(sys.argv[1]), float(sys.argv[2])
          ratio = before / after
          print(f"8 MiB: whole-file {before}s / positional {after}s = {ratio:.1f}x")
          if ratio < 5:
              raise SystemExit(f"FAIL: the positional write is only {ratio:.1f}x faster; it must be at least 5x")
          PY

      - name: A soft,timeo=50 mount must survive the write it used to fail
        working-directory: nfs/fat32demo
        run: |
          set -euo pipefail
          # The original defect was not only slow: a soft-mounted client GAVE
          # UP with EIO, because one whole-file WRITE round-trip exceeded its
          # timeout. This asserts the write now completes on the very mount
          # options that used to break it.
          /tmp/bench/mkimg /tmp/bench/soft.img
          /tmp/bench/fat32demo -image /tmp/bench/soft.img -addr 127.0.0.1:12050 -rw &
          demo_pid=$!
          trap 'sudo umount -f /mnt/soft 2>/dev/null || true; kill $demo_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/12050) 2>/dev/null; then break; fi
            sleep 0.2
          done
          sudo mkdir -p /mnt/soft
          sudo mount -t nfs -o vers=3,tcp,port=12050,mountport=12050,nolock,soft,timeo=50,retrans=2,wsize=65536 \
            127.0.0.1:/ /mnt/soft
          sudo dd if=/dev/urandom of=/mnt/soft/TARGET.BIN bs=64k count=32 \
            oflag=direct conv=notrunc status=none
          test "$(stat -c %s /mnt/soft/TARGET.BIN)" -eq 2097152
          echo "soft,timeo=50 completed 2 MiB with no EIO"
          sudo umount /mnt/soft
